name: Auto Sync Fork

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  sync_job:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Sync Upstream
        run: |
          git config --global user.name "sync"
          git config --global user.email "sync@github.com"
          git remote add upstream https://github.com/EvoLinkAI/awesome-gpt-image-2-API-and-Prompts.git
          git fetch upstream
          git checkout main
          git reset --hard upstream/main
          git push https://${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git main --force
